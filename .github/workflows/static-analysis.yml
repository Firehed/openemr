name: Static Analysis

on:
  push:
    branches:
    - master
    - rel-*
  pull_request:
    branches:
    - master
    - rel-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-dupes:
    name: Detect duplicate functions
    runs-on: ubuntu-24.04
    steps:

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Min composer version
        coverage: none

    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Composer Cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-8.2-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-8.2-
          ${{ runner.os }}-composer-

    - name: Composer Install
      run: |
        composer install --prefer-dist --no-progress

    - name: Run detector
      run: php -d memory_limit=1g ci/findDuplicateFunctions.php
